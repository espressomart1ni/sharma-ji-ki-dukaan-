<script>
(function () {
  var errs = [];
  addEventListener('error', function (e) { var t = e.target; errs.push(t && t.src ? 'FAILED TO LOAD: ' + t.src : (e.message || 'error') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : '')); }, true);
  addEventListener('unhandledrejection', function (e) { errs.push('Promise: ' + ((e.reason && e.reason.message) || e.reason)); });

    if (window.__shopBooted) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;background:#1c1410;color:#f3e3b8;font:15px/1.5 system-ui;padding:24px;text-align:center;z-index:200';

    document.body.appendChild(d);
  }, 6000);
})();
